<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weeb Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              anime: ['"M PLUS Rounded 1c"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Manga / VTuber Grid Background */
      body {
        background-color: #fdf2f8; /* very light pink */
        background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
        background-size: 24px 24px;
      }
      .dark body {
        background-color: #0f172a;
        background-image: radial-gradient(#334155 2px, transparent 2px);
      }
      
      /* Brutalist Hard Shadows */
      .brutal-shadow {
        box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
      }
      .dark .brutal-shadow {
        box-shadow: 6px 6px 0px 0px rgba(255,105,180,1);
      }
      
      .brutal-shadow-sm {
        box-shadow: 3px 3px 0px 0px rgba(0,0,0,1);
      }
      .dark .brutal-shadow-sm {
        box-shadow: 3px 3px 0px 0px rgba(255,105,180,1);
      }
      
      .brutal-border {
        border: 4px solid #000;
      }
      .dark .brutal-border {
        border: 4px solid #fff;
      }
    </style>
  </head>
  <body class="transition-colors duration-300 font-anime overflow-hidden text-gray-900 dark:text-gray-100 selection:bg-pink-400 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
