<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook ToDo</title>
    <!-- Handwriting font for the paper aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#3b82f6', // Blueprint blue
              'primary-hover': '#2563eb',

            fontFamily: {
              paper: ['Kalam', 'cursive'],

          }
        }
      }
    </script>
  </head>
  <body class="bg-gray-300 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300 font-sans">

    <script type="module" src="/src/main.jsx"></script>
