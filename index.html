<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              anime: ['"M PLUS Rounded 1c"', 'sans-serif'],
              handwriting: ['Caveat', 'cursive'],
            }
          }
        }
      }
    </script>
    <style>
      /* Retro Brutalist Utilities */
      .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
      .dark .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(255,105,180,1); }
      .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(0,0,0,1); }
      .dark .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(255,105,180,1); }
      .brutal-border { border: 4px solid #000; }
      .dark .brutal-border { border: 4px solid #fff; }

      /* Retro Grid Background */
      .bg-retro-grid {
        background-color: #fdf2f8;
        background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
        background-size: 24px 24px;
      }
      .dark .bg-retro-grid {
        background-color: #0f172a;
        background-image: radial-gradient(#334155 2px, transparent 2px);
      }

      /* TipTap ProseMirror Styling */
      .ProseMirror { outline: none; min-height: 100%; padding: 0.5rem; }
      .ProseMirror p { margin-bottom: 0.75rem; line-height: 1.6; font-size: 1.25rem; }
      .ProseMirror h1, .ProseMirror h2, .ProseMirror h3 { font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; line-height: 1.2; }
      .ProseMirror h1 { font-size: 2.25rem; }
      .ProseMirror h2 { font-size: 1.875rem; }
      .ProseMirror h3 { font-size: 1.5rem; }
      .ProseMirror ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; font-size: 1.25rem; }
      .ProseMirror ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; font-size: 1.25rem; }
      .ProseMirror img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
      
      /* Placeholder styling */
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: #adb5bd;
        pointer-events: none;
        height: 0;
      }
    </style>
  </head>
  <body class="transition-colors duration-300 font-anime overflow-hidden text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
