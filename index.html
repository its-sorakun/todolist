<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Load Tailwind with Typography plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              anime: ['"M PLUS Rounded 1c"', 'sans-serif'],
              handwriting: ['Caveat', 'cursive'],
            }
          }
        }
      }
    </script>
    <style>
      /* Retro Brutalist Utilities */
      .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
      .dark .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(255,105,180,1); }
      .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(0,0,0,1); }
      .dark .brutal-shadow-sm { box-shadow: 3px 3px 0px 0px rgba(255,105,180,1); }
      .brutal-border { border: 4px solid #000; }
      .dark .brutal-border { border: 4px solid #fff; }

      /* Retro Grid Background */
      .bg-retro-grid {
        background-color: #fdf2f8;
        background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
        background-size: 24px 24px;
      }
      .dark .bg-retro-grid {
        background-color: #0f172a;
        background-image: radial-gradient(#334155 2px, transparent 2px);
      }

      /* TipTap Outline Fix */
      .ProseMirror { outline: none; min-height: 100%; }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        float: left;
        color: inherit;
        opacity: 0.5;
        pointer-events: none;
        height: 0;
      }

      /* TipTap TaskList Fix */
      ul[data-type="taskList"] {
        list-style: none;
        padding: 0;
      }
      ul[data-type="taskList"] li {
        display: flex;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }
      ul[data-type="taskList"] li > label {
        margin-right: 0.75rem;
        user-select: none;
        margin-top: 0.25rem;
      }
      ul[data-type="taskList"] li > div {
        flex: 1;
        min-width: 0;
      }
      ul[data-type="taskList"] li > div > p {
        margin: 0;
        transition: all 0.2s ease-in-out;
      }
      ul[data-type="taskList"] li[data-checked="true"] > div > p {
        text-decoration: line-through;
        opacity: 0.6;
      }
      ul[data-type="taskList"] input[type="checkbox"] {
        width: 1.2rem;
        height: 1.2rem;
        cursor: pointer;
        accent-color: #ec4899;
      }
      .mask-bottom {
        -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      }
    </style>
  </head>
  <body class="transition-colors duration-300 font-anime overflow-hidden text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
