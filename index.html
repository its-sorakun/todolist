<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weeb Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Material You Weeb Theme (Pastel Sakura)
              primary: '#FF8DA1',
              'primary-container': '#FFD9E2',
              'on-primary-container': '#3B0014',
              surface: '#FFF8FA',
              'surface-container': '#FFEDF4',
              'surface-variant': '#F2DDE1',
              
              // Dark mode variants
              'primary-dark': '#FFB2C0',
              'primary-container-dark': '#5C1126',
              'on-primary-container-dark': '#FFD9E2',
              'surface-dark': '#1A1114',
              'surface-container-dark': '#2B1B22',
              'surface-variant-dark': '#4A333A',
            },
            fontFamily: {
              anime: ['"M PLUS Rounded 1c"', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="transition-colors duration-300 font-anime overflow-hidden bg-surface dark:bg-surface-dark text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
